# 书的元数据。语言版本目录与 editions 一一对应（第一个为权威版本，其余逐条对齐）。
[book]
version = "0.1.0"
authors = ["The Omega Institute"]
license = "CC-BY-4.0"
editions = ["zh", "en"]
# 封面与站点卡片上的赛博朋克代号，形如 CODE//NAME。
code = "ZETA//CRITICAL"
# 出版日期（YYYY-MM-DD），进入 PDF/EPUB 元数据；留空则用构建当天（产物不能跨日复现）。
date = "2026-11-21"
# Stable publication DOI (usually the Zenodo concept DOI); omit until one is assigned.
doi = ""

[book.title]
zh = "临界线上的对称：黎曼猜想是如何被证明的"
en = "Symmetry on the Critical Line: How the Riemann Hypothesis Is Proved"

[book.subtitle]
zh = "一部面向直觉的 Lean 形式化导读"
en = "An Intuitive Guide to the Formal Proof"

[book.description]
zh = "这部中英双语专著导读 Levent Alpöge 用 Lean 4 完成的黎曼猜想及狄利克雷 L 函数广义黎曼猜想的证明。The Omega Institute 将证明源码托管于 the-omega-institute/riemann-hypothesis，该仓库派生自 Deicyde 的上游验证镜像 Deicyde/riemann-hypothesis。全书由序章、七章正文和尾声组成，配有脚本生成的静态插图（figures/）、四个交互式可视化（viz/）和两部带中英双语字幕的讲解影片（films/）。"
en = "This bilingual monograph in Chinese and English guides readers through Levent Alpöge's Lean 4 proof of the Riemann Hypothesis and the Generalized Riemann Hypothesis for Dirichlet L-functions. The Omega Institute hosts the proof source in the-omega-institute/riemann-hypothesis, a fork of Deicyde's upstream verification mirror (Deicyde/riemann-hypothesis). The book comprises a prelude, seven chapters, and a coda, with script-generated static figures (figures/), four interactive visualizations (viz/), and two explainer films with Chinese and English subtitles (films/)."

[outputs]
html = true
# PDF 版本：screen = 深色霓虹屏幕版；print = 白底印刷版；academic = A4 单栏学术预印本（可选）。
pdf = ["screen", "print"]
# EPUB 3（Apple Books 兼容，MathML 数学）。
epub = true

[pdf]
# Typst 纸张名：a4、a5、us-letter、iso-b5 …
paper = "a4"

[epub]
# 是否把 Chakra Petch / JetBrains Mono 嵌入 EPUB（中文正文始终使用阅读器自带字体）。
embed_fonts = false

[numbering.unnumbered]
"coda.md" = "Coda"
